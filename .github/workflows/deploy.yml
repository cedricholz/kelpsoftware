name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-1
  SITE_BUCKET: kelpsoftware-site
  DISTRIBUTION_ID: E1LOPE4QDIH8SX
  # Created by infra/deploy-role.yml in account 433723587324.
  DEPLOY_ROLE_ARN: arn:aws:iam::433723587324:role/kelpsoftware-site-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed bundles never change, so cache them forever. Everything else
      # (HTML, favicons, logos, manifest) keeps a stable URL and must revalidate.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets "s3://$SITE_BUCKET/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload everything else
        run: |
          aws s3 sync dist/ "s3://$SITE_BUCKET/" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
