version: 0.2

# Required env vars (set on the CodeBuild project):
#   SITE_BUCKET            - S3 bucket name (e.g. kelpsoftware-site)
#   DISTRIBUTION_ID        - CloudFront distribution id
# Optional:
#   AWS_DEFAULT_REGION     - defaults to the project's region

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - npm --version

  pre_build:
    commands:
      - npm ci

  build:
    commands:
      - npm run build

  post_build:
    commands:
      # Hashed asset files: long cache, immutable.
      - |
        aws s3 sync dist/ "s3://$SITE_BUCKET/" \
          --delete \
          --exclude "index.html" \
          --exclude "*.html" \
          --cache-control "public,max-age=31536000,immutable"
      # HTML entry: never cache, always revalidate.
      - |
        aws s3 sync dist/ "s3://$SITE_BUCKET/" \
          --exclude "*" \
          --include "*.html" \
          --cache-control "public,max-age=0,must-revalidate" \
          --content-type "text/html; charset=utf-8"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

artifacts:
  files:
    - "**/*"
  base-directory: dist
  discard-paths: no

cache:
  paths:
    - node_modules/**/*
